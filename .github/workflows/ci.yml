name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  back-end:
    name: "Back-end: types, lint, format, tests, schema"
    # 22.04: mongodb-memory-server's default MongoDB 6.0.9 has no Ubuntu 24.04 binary
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: back-end
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: back-end/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Create .env from .env.dist
        run: cp .env.dist .env
      - name: Typecheck
        run: npm run check
      - name: Lint
        run: npx eslint "src/**/*.ts"
      - name: Format check
        run: npx prettier --check "src/**/*.ts"
      - name: Tests
        run: npm test
      # The e2e spec boots the GraphQL module, and autoSchemaFile rewrites
      # schema.gql as a side effect. If that differs from the committed copy,
      # someone changed a resolver without regenerating.
      - name: Schema matches resolvers
        run: git diff --exit-code schema.gql

  front-end:
    name: "Front-end: build & tests"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front-end
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: front-end/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Generate GraphQL types
        run: npm run generate-types
      - name: Build (typecheck + lint)
        run: npm run build
      - name: Tests
        run: npx vitest run
